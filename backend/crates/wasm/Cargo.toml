[package]
name = "ulttt-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings to the rules and solver, for the frontend."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ulttt-engine = { path = "../engine" }
ulttt-game = { path = "../game" }
ulttt-solver = { path = "../solver" }
# Must match the wasm-bindgen CLI version in .devcontainer/Dockerfile and CI.
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
