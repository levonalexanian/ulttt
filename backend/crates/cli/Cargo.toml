[package]
name = "ulttt-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line interface to the Ultimate Tic-Tac-Toe engine and solver."
publish = false

[[bin]]
name = "ulttt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ulttt-game = { path = "../game" }
ulttt-certificate = { path = "../certificate" }
ulttt-db = { path = "../db" }
ulttt-engine = { path = "../engine" }
ulttt-solver = { path = "../solver" }

[lints]
workspace = true
