name: Lean

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "proofs/**"
      - ".github/workflows/lean.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          build-args: "--wfail"
